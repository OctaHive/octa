version: 1

# The fixture deliberately turns a semantic Codex failure into data. The
# dependent task proves workflows can gate on the exported outcome without
# treating the harness process exit code as the workflow result.
tasks:
  codex-run:
    cmds:
      - id: agent
        codex:
          prompt: Exercise the deterministic Codex integration fixture.
    outputs:
      outcome: { step: agent, field: outcome }

  verify-outcome:
    deps: [codex-run]
    vars:
      CODEX_OUTCOME:
        from: { task: codex-run, output: outcome }
    shell: |
      if [ "{{ CODEX_OUTCOME }}" != "failed" ]; then
        echo "unexpected Codex outcome: {{ CODEX_OUTCOME }}" >&2
        exit 1
      fi
      printf verified > semantic-outcome.verified
