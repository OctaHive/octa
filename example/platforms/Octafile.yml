version: 1

includes:
  platform: ./Taskfile_{{OS}}.yml

tasks:
  build_win:
    platforms: ["windows"]
    shell: echo Windows build

  build_mac:
    platforms: ["macos/amd64"]
    shell: echo Mac OS build

  build_arm:
    platforms: ["arm64"]
    shell: echo ARM64 build

  build:
    cmds:
      - task: build_win
      - task: build_mac
      - task: build_arm

  build_commands:
    cmds:
      - shell: echo Windows command
        platforms: [windows]
      - shell: echo Unix command
        platforms: [linux, darwin]
      - task: build_arm
        platforms: [arm64]
      - echo Cross-platform command

  platform_info:
    cmds:
      - task: platform:info
