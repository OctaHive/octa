version: 1

vars:
  PROFILE: development

dotenv:
  - .env.{{ PROFILE }}
  - config/configured.env

env:
  NAME: Bob

tasks:
  print-env: echo $NAME

  print-system-env: echo ${EXT_NAME:-"Alice"}

  print-file-env: echo ${FILE_NAME}

  print-configured-file-env: echo ${SEARCHED_NAME} ${EXACT_NAME}

  print-task-file-env:
    dir: nested
    dotenv:
      - .env.task
    shell: echo ${TASK_FILE_NAME}

  print-dynamic-env:
    vars:
      COMMIT: '{{ shell(command="git rev-parse --short HEAD") }}'
    env:
      EXPORTED_COMMIT: "{{ COMMIT }}"
      CURRENT_BRANCH: '{{ shell(command="git branch --show-current") }}'
    shell: echo ${EXPORTED_COMMIT} ${CURRENT_BRANCH}
