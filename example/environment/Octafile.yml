version: 1

vars:
  PROFILE: development
  RELEASE_CHANNEL: "{{ PROFILE }}-preview"
  API_TOKEN:
    value: development-token
    secret: true

dotenv:
  - .env.{{ PROFILE }}
  - config/configured.env

env:
  NAME: Bob

tasks:
  print-env: echo $NAME

  print-system-env: echo ${EXT_NAME:-"Alice"}

  print-file-env: echo ${FILE_NAME}

  print-configured-file-env: echo ${SEARCHED_NAME} ${EXACT_NAME}

  print-task-file-env:
    dir: nested
    dotenv:
      - .env.task
    shell: echo ${TASK_FILE_NAME}

  print-dynamic-env:
    vars:
      COMMIT:
        sh: git rev-parse --short HEAD
    env:
      EXPORTED_COMMIT: "{{ COMMIT }}"
      CURRENT_BRANCH: '{{ "git branch --show-current" | shell }}'
      DESCRIBE: '{{ shell(command="git describe --tags --always") }}'
    shell: echo ${EXPORTED_COMMIT} ${CURRENT_BRANCH} ${DESCRIBE}
