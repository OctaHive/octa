version: 1

vars:
  ENVIRONMENT: development

tasks:
  deploy:
    if: test "{{ ENVIRONMENT }}" = "production"
    shell: echo "Deploying to production"

  plugin-condition:
    if:
      tpl: condition passed
    shell: echo "Plugin condition passed"

  pipeline:
    if:
      before_deps: test -f Octafile.yml
      after_deps:
        shell: test -d .
        evaluate: per_command
    cmds:
      - shell: echo "Preparing deployment"
        if: test -n "{{ ENVIRONMENT }}"
      - shell: ./optional-check.sh
        ignore_error: true
      - task: deploy
        silent: true
