version: 1

vars:
  DEPLOYMENT_ENVIRONMENTS:
    - development
    - staging
    - production

tasks:
  deploy:
    vars:
      API_TOKEN:
        required: true
        secret: true
    shell: echo "API token is configured"

  select-environment:
    vars:
      ENVIRONMENT:
        required: prompt
        question: Select deployment environment
        enum:
          - development
          - staging
          - production
    shell: echo "Deploying to {{ ENVIRONMENT }}"

  select-shared-environment:
    vars:
      ENVIRONMENT:
        required: prompt
        question: Select deployment environment
        enum: "{{ DEPLOYMENT_ENVIRONMENTS }}"
    shell: echo "Deploying to {{ ENVIRONMENT }}"
