version: 1

tasks:
  deploy:
    vars:
      API_TOKEN:
        required: true
        secret: true
    shell: echo "API token is configured"

  select-environment:
    vars:
      ENVIRONMENT:
        required: prompt
        question: Select deployment environment
        enum:
          - development
          - staging
          - production
    shell: echo "Deploying to {{ ENVIRONMENT }}"
