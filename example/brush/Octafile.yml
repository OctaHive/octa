version: 1

tasks:
  inline:
    shell: |
      names=(Octa Brush)
      printf '%s\n' "${names[*]}"

  script:
    shell: source ./scripts/greet.sh

  portable-utils:
    shell: |
      dir=$(mktemp -d)
      printf 'portable\n' > "$dir/source.txt"
      cp "$dir/source.txt" "$dir/copy.txt"
      cat "$dir/copy.txt"
      sleep 0.1
      rm -r "$dir"
