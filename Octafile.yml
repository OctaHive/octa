version: 1

tasks:
  build-release:
    shell: cargo build --release -p octa-cli

  build:
    shell: cargo build -p octa-cli

  build-pligins:
    cmds:
      - task: build-shell-plugin
      - task: build-tpl-plugin
      - task: build-junit-plugin

  build-shell-plugin:
    shell: cargo build -p octa_plugin_shell

  build-tpl-plugin:
    shell: cargo build -p octa_plugin_tpl

  build-junit-plugin:
    shell: cargo build -p octa_plugin_junit

  lint:
    cmds:
      - cargo clippy -- -D warnings
