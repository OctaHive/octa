[package]
name = "octa-cache"
description = "Portable task-result input snapshots and output bundles"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
include = ["src/", "README.md"]

[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true, features = ["rayon"] }
dunce = "1.0.5"
fs2 = "0.4.3"
futures = "0.3.34"
glob = "0.3.4"
ignore = "0.4.33"
octa-cache-protocol = { version = "0.3.0", path = "../octa-cache-protocol" }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
same-file = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zstd = { workspace = true }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
proptest = "1.9.0"
tempfile = { workspace = true }
