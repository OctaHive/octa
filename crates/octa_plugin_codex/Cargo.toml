[package]
name = "octa_plugin_codex"
description = "Codex task execution plugin for Octa"
version = "0.5.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
include = ["src/"]

[[bin]]
name = "octa_plugin_codex"
bench = false

[[bin]]
name = "codex-test-fixture"
path = "tests/fixtures/codex_test_fixture.rs"
test = false
bench = false
doc = false

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
cap-std = { workspace = true }
jsonschema = { workspace = true }
octa-plugin = { version = "0.5.1", path = "../octa-plugin" }
serde = { workspace = true }
serde_json = { workspace = true }
same-file = { workspace = true }
semver = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
octa-plugin-manager = { version = "0.5.1", path = "../octa-plugin-manager" }
serde_yml = { workspace = true }
tempfile = { workspace = true }
