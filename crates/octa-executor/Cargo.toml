[package]
name = "octa-executor"
description = "Execute tasks"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
include = ["src/"]

[dependencies]
octa-octafile = { version = "0.3.0", path = "../octa-octafile" }
octa-dag = { version = "0.3.0", path = "../octa-dag" }
octa-finder = { version = "0.3.0", path = "../octa-finder" }
octa-plugin = { version = "0.3.0", path = "../octa-plugin" }
octa-plugin-manager = { version = "0.3.0", path = "../octa-plugin-manager" }
octa-output = { version = "0.3.0", path = "../octa-output" }
anyhow = { workspace = true }
async-trait = { workspace = true }
crossterm = { workspace = true }
chrono = { version = "0.4.45", features = ["serde"] }
dunce = "1.0.5"
dotenvy = "0.15.7"
indexmap = { workspace = true }
lazy_static = { workspace = true }
glob = "0.3.4"
futures = "0.3.34"
ignore = "0.4.33"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
sha2 = "0.11"
sled = "0.34"
shellexpand = "3.1.2"
whoami = { workspace = true }
tera = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tracing-test = "0.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs"] }
