[package]
name = "octa-cli"
description = "Command line interface for Octa builder"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
include = ["src/"]

[[bin]]
name = "octa"
path = "src/main.rs"

[dependencies]
octa-finder = { version = "0.3.0", path = "../octa-finder" }
octa-monorepo = { version = "0.3.0", path = "../octa-monorepo" }
octa-octafile = { version = "0.3.0", path = "../octa-octafile" }
octa-output = { version = "0.3.0", path = "../octa-output" }
octa-executor = { version = "0.3.0", path = "../octa-executor" }
octa-plugin-manager = { version = "0.3.0", path = "../octa-plugin-manager" }
octa-plugin = { version = "0.3.0", path = "../octa-plugin" }
clap_complete = "4"
clap = { version = "4.6", features = ["derive", "env"] }
dialoguer = "0.12"
dotenvy = "0.15.7"
lazy_static = { workspace = true }
serde = { workspace = true }
serde_yml = { workspace = true }
sled = "0.34"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3.27"
pretty_assertions = "1.4"
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = { workspace = true }
portable-pty = "0.9"
