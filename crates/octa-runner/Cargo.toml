[package]
name = "octa-runner"
description = "Headless Octa execution process"
version = "0.4.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
include = ["src/"]

[[bin]]
name = "octa-runner"
path = "src/main.rs"

[dependencies]
octa-executor = { version = "0.4.0", path = "../octa-executor" }
octa-octafile = { version = "0.4.0", path = "../octa-octafile" }
octa-output = { version = "0.4.0", path = "../octa-output" }
octa-plugin = { version = "0.4.0", path = "../octa-plugin" }
octa-runtime = { version = "0.4.0", path = "../octa-runtime" }
octa-runner-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
assert_cmd = "2.2.2"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
jsonschema = { workspace = true }
octa-cache-protocol = { version = "0.4.0", path = "../octa-cache-protocol" }
octa-cache = { version = "0.4.0", path = "../octa-cache" }
octa-cache-http = { version = "0.4.0", path = "../octa-cache-http" }
octa-cache-test-support = { path = "../octa-cache-test-support" }
octa-plugin-manager = { version = "0.4.0", path = "../octa-plugin-manager" }
serde_yml = { workspace = true }
rustls = { version = "0.23.44", default-features = false, features = ["ring"] }
tempfile = { workspace = true }
wait-timeout = "0.2"
