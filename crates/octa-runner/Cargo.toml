[package]
name = "octa-runner"
description = "Headless Octa execution process"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
include = ["src/"]

[[bin]]
name = "octa-runner"
path = "src/main.rs"

[dependencies]
octa-executor = { version = "0.3.0", path = "../octa-executor" }
octa-octafile = { version = "0.3.0", path = "../octa-octafile" }
octa-output = { version = "0.3.0", path = "../octa-output" }
octa-runtime = { version = "0.3.0", path = "../octa-runtime" }
octa-runner-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
same-file = { workspace = true }

[dev-dependencies]
assert_cmd = "2.2.2"
jsonschema = { workspace = true }
octa-cache-protocol = { version = "0.3.0", path = "../octa-cache-protocol" }
octa-plugin-manager = { version = "0.3.0", path = "../octa-plugin-manager" }
octa-plugin = { version = "0.3.0", path = "../octa-plugin" }
serde_yml = { workspace = true }
tempfile = { workspace = true }
wait-timeout = "0.2"
