[workspace]
resolver = "2"
members = [
  "crates/octa-cli",
  "crates/octa-octafile",
  "crates/octa-dag",
  "crates/octa-finder",
  "crates/octa-executor",
  "crates/octa-plugin",
  "crates/octa-plugin-manager",
  "crates/octa_plugin_shell",
  "crates/octa_plugin_tpl",
]

[workspace.package]
license = "MIT"
authors = ["octa contributors <xxx@ccc.dev>"]
homepage = "https://github.com/OctaHive/octa"
repository = "https://github.com/OctaHive/octa"
edition = "2021"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
lazy_static = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yml = "0.0.13"
yaml-rust2 = { version = "0.12.0", default-features = false }
jsonschema = { version = "0.52.1", default-features = false }
humantime = "2.4.0"
whoami = "2.1.3"
tera = { version = "1.20.1", features = ["builtins"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "registry",
  "env-filter",
  "fmt",
  "std",
] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
regex = "1.13.1"
uuid = { version = "1.26", features = ["v4"] }

# default to small, optimized workspace release binaries
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
