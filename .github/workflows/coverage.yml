name: Coverage

on:
  pull_request:
    branches:
      - "*"
    paths:
      - ".github/workflows/coverage.yml"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - "*"
    paths:
      - ".github/workflows/coverage.yml"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  coverage:
    name: Coverage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build plugins for Linux and macOS
        if: matrix.os != 'windows-latest'
        run: |
          cargo build -p octa_plugin_shell
          cp target/debug/octa_plugin_shell plugins
          cargo build -p octa_plugin_tpl
          cp target/debug/octa_plugin_tpl plugins
          cargo build -p octa_plugin_junit
          cp target/debug/octa_plugin_junit plugins
          cargo build -p octa-plugin --example octa_plugin_test
          cp target/debug/examples/octa_plugin_test plugins
      - name: Build plugins for Windows
        if: matrix.os == 'windows-latest'
        run: |
          cargo build -p octa_plugin_shell
          cp target/debug/octa_plugin_shell.exe plugins
          cargo build -p octa_plugin_tpl
          cp target/debug/octa_plugin_tpl.exe plugins
          cargo build -p octa_plugin_junit
          cp target/debug/octa_plugin_junit.exe plugins
          cargo build -p octa-plugin --example octa_plugin_test
          cp target/debug/examples/octa_plugin_test.exe plugins
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          name: codecov-octa-${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
      - name: Enforce production line coverage
        # Linux and macOS already satisfy the established gate. Windows was
        # added later and needs a measured platform baseline before enforcing
        # a threshold for its platform-specific control-flow.
        if: matrix.os != 'windows-latest'
        run: cargo llvm-cov report --summary-only --fail-under-lines 96.3
