name: Build

on:
  push:
    tags:
      - "v*"
      - test-release

env:
  CARGO_TERM_COLOR: always
  TARGET_DIR: target_ci
  OCTA_BUILD_COMMIT: ${{ github.sha }}

jobs:
  build:
    name: Build for ${{ matrix.platform.os_name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os_name: Linux-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: octa
            name: octa-Linux-amd64.tar.gz
            cargo_command: cargo
            runtime_platform: linux-x86_64

          - os_name: Linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: octa
            name: octa-Linux-arm64.tar.gz
            cargo_command: cargo
            runtime_platform: linux-aarch64

          - os_name: Windows-amd64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bin: octa.exe
            name: octa-Windows-amd64.zip
            cargo_command: cargo
            runtime_platform: windows-x86_64

          - os_name: macOS-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            bin: octa
            name: octa-Darwin-aarch64.tar.gz
            cargo_command: cargo
            runtime_platform: macos-aarch64

          - os_name: macOS-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bin: octa
            name: octa-Darwin-x86_64.tar.gz
            cargo_command: cargo
            runtime_platform: macos-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.platform.target }}

      - name: Build binary (*nix)
        shell: bash
        run: |
          ${{ matrix.platform.cargo_command }} build --locked --release --target ${{ matrix.platform.target }}
        if: ${{ !contains(matrix.platform.os, 'windows') }}

      - name: Build binary (Windows)
        # We have to use the platform's native shell. If we use bash on
        # Windows then OpenSSL complains that the Perl it finds doesn't use
        # the platform's native paths and refuses to build.
        shell: powershell
        run: |
          & ${{ matrix.platform.cargo_command }} build --locked --release --target ${{ matrix.platform.target }}
        if: contains(matrix.platform.os, 'windows')

      - name: Strip binary
        shell: bash
        run: |
          strip target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }}
        # GNU strip is not available for the Windows artifact in this job.
        if: ${{ !contains(matrix.platform.os, 'windows') }}

      - name: Package as archive
        shell: bash
        run: |
          # Read the single protocol source of truth before constructing the
          # release metadata consumed by OctaCity inventory.
          PLUGIN_PROTOCOL=$(sed -n 's/^pub const PLUGIN_PROTOCOL_VERSION: u16 = \([0-9][0-9]*\);$/\1/p' crates/octa-plugin/src/protocol.rs)
          if [[ ! "${PLUGIN_PROTOCOL}" =~ ^[0-9]+$ ]]; then
            echo "Could not read PLUGIN_PROTOCOL_VERSION from the protocol crate" >&2
            exit 1
          fi
          sha256_digest() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d ' ' -f 1
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1" | cut -d ' ' -f 1
            else
              echo "No SHA-256 command is available on this runner" >&2
              return 1
            fi
          }
          cd target/${{ matrix.platform.target }}/release
          mkdir ./release
          mkdir ./release/plugins
          if [[ "${{ matrix.platform.os }}" == "windows-2025" ]]; then
            cp ./octa_plugin_shell.exe ./release/plugins
            cp ./octa_plugin_tpl.exe ./release/plugins
            cp ./octa_plugin_junit.exe ./release/plugins
            cp octa.exe ./release
            cp octa-runner.exe ./release
          else
            cp ./octa_plugin_shell ./release/plugins
            cp ./octa_plugin_tpl ./release/plugins
            cp ./octa_plugin_junit ./release/plugins
            cp octa ./release
            cp octa-runner ./release
          fi

          SHELL_ENTRY="octa_plugin_shell"
          TPL_ENTRY="octa_plugin_tpl"
          JUNIT_ENTRY="octa_plugin_junit"
          if [[ "${{ matrix.platform.os }}" == "windows-2025" ]]; then
            SHELL_ENTRY="${SHELL_ENTRY}.exe"
            TPL_ENTRY="${TPL_ENTRY}.exe"
            JUNIT_ENTRY="${JUNIT_ENTRY}.exe"
          fi
          SHELL_DIGEST=$(sha256_digest "./release/plugins/${SHELL_ENTRY}")
          TPL_DIGEST=$(sha256_digest "./release/plugins/${TPL_ENTRY}")
          JUNIT_DIGEST=$(sha256_digest "./release/plugins/${JUNIT_ENTRY}")
          VERSION="${GITHUB_REF_NAME#v}"
          printf 'manifest_version: 1\nname: shell\nversion: "%s"\nprotocol: %s\nplatforms:\n  - %s\nentrypoint: %s\nsha256: %s\ncapabilities:\n  - shell\n' "$VERSION" "$PLUGIN_PROTOCOL" "${{ matrix.platform.runtime_platform }}" "$SHELL_ENTRY" "$SHELL_DIGEST" > ./release/plugins/shell.plugin.yml
          printf 'manifest_version: 1\nname: tpl\nversion: "%s"\nprotocol: %s\nplatforms:\n  - %s\nentrypoint: %s\nsha256: %s\n' "$VERSION" "$PLUGIN_PROTOCOL" "${{ matrix.platform.runtime_platform }}" "$TPL_ENTRY" "$TPL_DIGEST" > ./release/plugins/tpl.plugin.yml
          printf 'manifest_version: 1\nname: junit\nversion: "%s"\nprotocol: %s\nplatforms:\n  - %s\nentrypoint: %s\nsha256: %s\n' "$VERSION" "$PLUGIN_PROTOCOL" "${{ matrix.platform.runtime_platform }}" "$JUNIT_ENTRY" "$JUNIT_DIGEST" > ./release/plugins/junit.plugin.yml
          printf 'version: 1\nplugins:\n  junit:\n    version: "%s"\n    protocol: %s\n    platforms: [%s]\n    entrypoint: %s\n    sha256: %s\n    source: junit.plugin.yml\n  shell:\n    version: "%s"\n    protocol: %s\n    platforms: [%s]\n    entrypoint: %s\n    sha256: %s\n    capabilities: [shell]\n    source: shell.plugin.yml\n  tpl:\n    version: "%s"\n    protocol: %s\n    platforms: [%s]\n    entrypoint: %s\n    sha256: %s\n    source: tpl.plugin.yml\n' "$VERSION" "$PLUGIN_PROTOCOL" "${{ matrix.platform.runtime_platform }}" "$JUNIT_ENTRY" "$JUNIT_DIGEST" "$VERSION" "$PLUGIN_PROTOCOL" "${{ matrix.platform.runtime_platform }}" "$SHELL_ENTRY" "$SHELL_DIGEST" "$VERSION" "$PLUGIN_PROTOCOL" "${{ matrix.platform.runtime_platform }}" "$TPL_ENTRY" "$TPL_DIGEST" > ./release/Octa.lock

          # Exercise the packaged binary against the exact generated lock so a
          # protocol or digest drift fails before an unusable archive is built.
          OCTA_PLUGINS_DIR=./release/plugins "./release/${{ matrix.platform.bin }}" plugin verify --lock ./release/Octa.lock

          # Inventory consumes this manifest without executing a potentially
          # guest-only binary on the agent host. Every matrix entry is native
          # to its release runner, so the executable remains its source of truth.
          "./release/octa-runner${{ contains(matrix.platform.os, 'windows') && '.exe' || '' }}" capabilities > ./release/octa-runner-capabilities.json
          cp ../../../.github/release-contract.json ./release/octa-release-contract.json
          (cd ./release && find . -type f ! -name SHA256SUMS -print | LC_ALL=C sort | while IFS= read -r file; do printf '%s  %s\n' "$(sha256_digest "$file")" "$file"; done > SHA256SUMS)

          if [[ "${{ matrix.platform.os }}" == "windows-2025" ]]; then
            7z a ../../../${{ matrix.platform.name }} ./release/*
          else
            tar czvf ../../../${{ matrix.platform.name }} -C ./release .
          fi
          cd -

          printf '%s  %s\n' "$(sha256_digest "${{ matrix.platform.name }}")" "${{ matrix.platform.name }}" > "${{ matrix.platform.name }}.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: octa-${{ matrix.platform.os_name }}
          path: |
            ${{ matrix.platform.name }}
            ${{ matrix.platform.name }}.sha256
          if-no-files-found: error

  attest-and-publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: octa-*
          path: dist
          merge-multiple: true
      - name: Attest archives and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: "dist/*"
          token: ${{ github.token }}
          body_path: Changelog.md
        if: startsWith( github.ref, 'refs/tags/v' )
