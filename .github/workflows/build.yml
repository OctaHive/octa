name: Build

on:
  push:
    tags:
      - "v*"
      - test-release

env:
  CARGO_TERM_COLOR: always
  TARGET_DIR: target_ci
  OCTA_BUILD_COMMIT: ${{ github.sha }}

jobs:
  build:
    name: Build for ${{ matrix.platform.os_name }}
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        platform:
          - os_name: Linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: octa
            name: octa-Linux-amd64.tar.gz
            cargo_command: cargo
            runtime_platform: linux-x86_64

          - os_name: Windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: octa.exe
            name: octa-Windows-amd64.zip
            cargo_command: cargo
            runtime_platform: windows-x86_64

          - os_name: macOS-aarch64
            os: macOS-latest
            target: aarch64-apple-darwin
            bin: octa
            name: octa-Darwin-aarch64.tar.gz
            cargo_command: cargo
            runtime_platform: macos-aarch64

          - os_name: macOS-x86_64
            os: macOS-latest
            target: x86_64-apple-darwin
            bin: octa
            name: octa-Darwin-x86_64.tar.gz
            cargo_command: cargo
            runtime_platform: macos-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build binary (*nix)
        shell: bash
        run: |
          ${{ matrix.platform.cargo_command }} build --locked --release --target ${{ matrix.platform.target }}
        if: ${{ !contains(matrix.platform.os, 'windows') }}

      - name: Build binary (Windows)
        # We have to use the platform's native shell. If we use bash on
        # Windows then OpenSSL complains that the Perl it finds doesn't use
        # the platform's native paths and refuses to build.
        shell: powershell
        run: |
          & ${{ matrix.platform.cargo_command }} build --locked --release --target ${{ matrix.platform.target }}
        if: contains(matrix.platform.os, 'windows')

      - name: Strip binary
        shell: bash
        run: |
          strip target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }}
        # GNU strip is not available for the Windows artifact in this job.
        if: ${{ !contains(matrix.platform.os, 'windows') }}

      - name: Package as archive
        shell: bash
        run: |
          cd target/${{ matrix.platform.target }}/release
          mkdir ./release
          mkdir ./release/plugins
          if [[ "${{ matrix.platform.os }}" == "windows-latest" ]]; then
            cp ./octa_plugin_shell.exe ./release/plugins
            cp ./octa_plugin_tpl.exe ./release/plugins
            cp ./octa_plugin_junit.exe ./release/plugins
            cp octa.exe ./release
            cp octa-runner.exe ./release
          else
            cp ./octa_plugin_shell ./release/plugins
            cp ./octa_plugin_tpl ./release/plugins
            cp ./octa_plugin_junit ./release/plugins
            cp octa ./release
            cp octa-runner ./release
          fi

          SHELL_ENTRY="octa_plugin_shell"
          TPL_ENTRY="octa_plugin_tpl"
          JUNIT_ENTRY="octa_plugin_junit"
          if [[ "${{ matrix.platform.os }}" == "windows-latest" ]]; then
            SHELL_ENTRY="${SHELL_ENTRY}.exe"
            TPL_ENTRY="${TPL_ENTRY}.exe"
            JUNIT_ENTRY="${JUNIT_ENTRY}.exe"
          fi
          SHELL_DIGEST=$(shasum -a 256 "./release/plugins/${SHELL_ENTRY}" | cut -d ' ' -f 1)
          TPL_DIGEST=$(shasum -a 256 "./release/plugins/${TPL_ENTRY}" | cut -d ' ' -f 1)
          JUNIT_DIGEST=$(shasum -a 256 "./release/plugins/${JUNIT_ENTRY}" | cut -d ' ' -f 1)
          (cd ./release && shasum -a 256 "${{ matrix.platform.bin }}" "octa-runner${{ contains(matrix.platform.os, 'windows') && '.exe' || '' }}" > SHA256SUMS)
          VERSION="${GITHUB_REF_NAME#v}"
          printf 'manifest_version: 1\nname: shell\nversion: "%s"\nprotocol: 1\nplatforms:\n  - %s\nentrypoint: %s\nsha256: %s\ncapabilities:\n  - shell\n' "$VERSION" "${{ matrix.platform.runtime_platform }}" "$SHELL_ENTRY" "$SHELL_DIGEST" > ./release/plugins/shell.plugin.yml
          printf 'manifest_version: 1\nname: tpl\nversion: "%s"\nprotocol: 1\nplatforms:\n  - %s\nentrypoint: %s\nsha256: %s\n' "$VERSION" "${{ matrix.platform.runtime_platform }}" "$TPL_ENTRY" "$TPL_DIGEST" > ./release/plugins/tpl.plugin.yml
          printf 'manifest_version: 1\nname: junit\nversion: "%s"\nprotocol: 1\nplatforms:\n  - %s\nentrypoint: %s\nsha256: %s\n' "$VERSION" "${{ matrix.platform.runtime_platform }}" "$JUNIT_ENTRY" "$JUNIT_DIGEST" > ./release/plugins/junit.plugin.yml
          printf 'version: 1\nplugins:\n  junit:\n    version: "%s"\n    protocol: 1\n    platforms: [%s]\n    entrypoint: %s\n    sha256: %s\n    source: junit.plugin.yml\n  shell:\n    version: "%s"\n    protocol: 1\n    platforms: [%s]\n    entrypoint: %s\n    sha256: %s\n    capabilities: [shell]\n    source: shell.plugin.yml\n  tpl:\n    version: "%s"\n    protocol: 1\n    platforms: [%s]\n    entrypoint: %s\n    sha256: %s\n    source: tpl.plugin.yml\n' "$VERSION" "${{ matrix.platform.runtime_platform }}" "$JUNIT_ENTRY" "$JUNIT_DIGEST" "$VERSION" "${{ matrix.platform.runtime_platform }}" "$SHELL_ENTRY" "$SHELL_DIGEST" "$VERSION" "${{ matrix.platform.runtime_platform }}" "$TPL_ENTRY" "$TPL_DIGEST" > ./release/Octa.lock

          if [[ "${{ matrix.platform.os }}" == "windows-latest" ]]; then
            7z a ../../../${{ matrix.platform.name }} ./release/*
          else
            tar czvf ../../../${{ matrix.platform.name }} -C ./release .
          fi
          cd -

          shasum -a 256 "${{ matrix.platform.name }}" > "${{ matrix.platform.name }}.sha256"

      - name: Publish release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: octa-${{ matrix.platform.os_name }}
          path: "octa*"
        if: github.ref == 'refs/tags/test-release'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: "octa-*"
          token: ${{ github.token }}
          body_path: Changelog.md
        if: startsWith( github.ref, 'refs/tags/v' )
