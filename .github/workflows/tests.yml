name: Tests

on:
  push:
    branches:
      - "*"
    paths:
      - ".github/workflows/tests.yml"
      - "crates/**"
      - "conformance/**"
      - "benchmarks/**"
      - "docs/**"
      - "example/**"
      - "Cargo.toml"
      - "Cargo.lock"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Run cargo check
        run: cargo check --workspace

  test:
    name: Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.os == 'windows-latest'
        with:
          python-version: "3.13"
      - name: Build Codex plugin and fixture
        run: cargo build -p octa_plugin_codex --bins
      - name: Build plugin for Linux and Mac OS
        if: matrix.os != 'windows-latest'
        run: |
          cargo build -p octa_plugin_shell
          cp target/debug/octa_plugin_shell plugins
          cargo build -p octa_plugin_tpl
          cp target/debug/octa_plugin_tpl plugins
          cargo build -p octa_plugin_junit
          cp target/debug/octa_plugin_junit plugins
          cargo build -p octa-plugin --example octa_plugin_test
          cp target/debug/examples/octa_plugin_test plugins
      - name: Build plugin for Windows
        if: matrix.os == 'windows-latest'
        run: |
          cargo build -p octa_plugin_shell
          cp target/debug/octa_plugin_shell.exe plugins
          cargo build -p octa_plugin_tpl
          cp target/debug/octa_plugin_tpl.exe plugins
          cargo build -p octa_plugin_junit
          cp target/debug/octa_plugin_junit.exe plugins
          cargo build -p octa-plugin --example octa_plugin_test
          cp target/debug/examples/octa_plugin_test.exe plugins
      - name: Run cargo test
        run: cargo test --workspace -- --nocapture
      - name: Test cache benchmark harness
        if: matrix.os != 'windows-latest'
        run: python3 -m unittest discover -s benchmarks/cache/tests -v
      - name: Run black-box agent conformance
        shell: bash
        run: |
          RUNNER="target/debug/octa-runner"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then RUNNER="${RUNNER}.exe"; fi
          python conformance/agent_ready.py --runner "$RUNNER" --plugins target/debug
      - name: Run Codex CLI and runner conformance
        shell: bash
        run: |
          OCTA="target/debug/octa"
          RUNNER="target/debug/octa-runner"
          CODEX_FIXTURE="target/debug/codex-test-fixture"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            OCTA="${OCTA}.exe"
            RUNNER="${RUNNER}.exe"
            CODEX_FIXTURE="${CODEX_FIXTURE}.exe"
          fi
          python conformance/codex_task.py \
            --octa "$OCTA" \
            --runner "$RUNNER" \
            --plugins target/debug \
            --codex-fixture "$CODEX_FIXTURE"
          python conformance/codex_runner.py \
            --runner "$RUNNER" \
            --plugins target/debug \
            --codex-fixture "$CODEX_FIXTURE"
          python conformance/codex_secrets.py \
            --octa "$OCTA" \
            --runner "$RUNNER" \
            --plugins target/debug \
            --codex-fixture "$CODEX_FIXTURE"
      - name: Upload Log to Github
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin_log
          path: ${{ github.workspace }}/plugins/shell.log
          if-no-files-found: ignore
          retention-days: 10

  lints:
    name: Lints
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check rustdoc
        run: cargo rustdoc -p octa_plugin_codex --bin octa_plugin_codex --all-features -- -D missing-docs
